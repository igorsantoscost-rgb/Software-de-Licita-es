{% extends "base.html" %}
{% block titulo %}Novo Cliente{% endblock %}
{% block conteudo %}

<div class="page-header">
  <h2>Novo Cliente</h2>
</div>

<div class="card card-form">
  <form method="POST">
    <h3>Dados da Empresa</h3>
    <div class="campo">
      <label>Razao Social *</label>
      <input type="text" name="nome" required placeholder="Ex: Empresa ABC Ltda">
    </div>
    <div class="campo">
      <label>CNPJ</label>
      <input type="text" name="cnpj" placeholder="00.000.000/0001-00">
    </div>

    <h3>Endereco</h3>
    <div class="grid-form-2">
      <div class="campo">
        <label>Rua / Logradouro</label>
        <input type="text" name="rua" placeholder="Ex: Rua das Flores">
      </div>
      <div class="campo campo-sm">
        <label>Numero</label>
        <input type="text" name="numero" placeholder="123">
      </div>
    </div>
    <div class="grid-form-2">
      <div class="campo">
        <label>Complemento</label>
        <input type="text" name="complemento" placeholder="Sala 101, Bloco B">
      </div>
      <div class="campo">
        <label>Bairro</label>
        <input type="text" name="bairro" placeholder="Centro">
      </div>
    </div>
    <div class="grid-form-3">
      <div class="campo">
        <label>Cidade</label>
        <input type="text" name="cidade" placeholder="Belo Horizonte">
      </div>
      <div class="campo campo-sm">
        <label>Estado</label>
        <select name="estado">
          <option value="">—</option>
          {% for uf in ufs %}
          <option value="{{ uf[0] }}">{{ uf[0] }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="campo campo-sm">
        <label>CEP</label>
        <input type="text" name="cep" placeholder="30000-000">
      </div>
    </div>

    <h3>Contato Principal</h3>
    <div class="grid-form-2">
      <div class="campo">
        <label>Nome do Contato</label>
        <input type="text" name="nome_contato" placeholder="Nome completo">
      </div>
      <div class="campo">
        <label>Cargo</label>
        <input type="text" name="cargo_contato" placeholder="Ex: Diretor, Gerente">
      </div>
    </div>
    <div class="grid-form-2">
      <div class="campo">
        <label>Telefone Fixo</label>
        <input type="text" name="telefone_fixo" placeholder="(31) 3333-4444">
      </div>
      <div class="campo">
        <label>WhatsApp</label>
        <input type="text" name="telefone_wpp" placeholder="(31) 99999-8888">
      </div>
    </div>
    <div class="grid-form-2">
      <div class="campo">
        <label>E-mail de Contato (avisos)</label>
        <input type="email" name="email_contato" placeholder="contato@empresa.com">
        <small class="muted">Recebera notificacoes de licitacoes e comentarios.</small>
      </div>
      <div class="campo">
        <label>E-mail Financeiro (boletos)</label>
        <input type="email" name="email_financeiro" placeholder="financeiro@empresa.com">
      </div>
    </div>

    <h3>Acesso do Cliente ao Sistema</h3>
    <div class="campo">
      <label>Nome do Usuario *</label>
      <input type="text" name="nome_usuario" required placeholder="Nome completo">
    </div>
    <div class="campo">
      <label>E-mail de Acesso *</label>
      <input type="email" name="email_usuario" required placeholder="email@empresa.com">
      <small class="muted">Usado para login no sistema.</small>
    </div>
    <div class="campo">
      <label>Senha *</label>
      <input type="password" name="senha_usuario" required placeholder="Senha inicial">
    </div>

    <div class="form-btns">
      <a href="{{ url_for('main.clientes') }}" class="btn">Cancelar</a>
      <button type="submit" class="btn btn-primary">Criar Cliente</button>
    </div>
  </form>
</div>

{% endblock %}
